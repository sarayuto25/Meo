name: Fetch phonics audio from Wikimedia Commons

# Runs when the fetch script or this workflow changes on the working branch,
# or manually. Downloads licensed recordings into phonics/audio/ and commits
# them together with js/audio-manifest.js (credits).
on:
  push:
    branches: [ccr-207cfbc0-ltrf9n]
    paths:
      - phonics/tools/fetch_commons_audio.py
      - .github/workflows/fetch-phonics-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-phonics-audio
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Download and convert recordings
        working-directory: phonics
        run: |
          rm -rf audio
          python3 tools/fetch_commons_audio.py

      - name: Commit audio and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phonics/audio phonics/js/audio-manifest.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add real human recordings from Wikimedia Commons" \
                     -m "Generated by .github/workflows/fetch-phonics-audio.yml; credits in phonics/js/audio-manifest.js."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
